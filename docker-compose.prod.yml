# Production stack: Postgres + Django (gunicorn) + Next.js + Caddy (auto HTTPS).
# Run with:  docker compose -f docker-compose.prod.yml up -d --build
# Reads secrets from a root .env file (copy .env.prod.example to .env first).

services:
  db:
    image: postgres:16-alpine
    container_name: flip7-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flip7-backend
    restart: unless-stopped
    entrypoint: ["sh", "/app/entrypoint.sh"]
    command: sh -c "python manage.py collectstatic --noinput && gunicorn flip7_backend.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DJANGO_ENV: prod
      DJANGO_SETTINGS_MODULE: flip7_backend.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DOMAIN}
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flip7-frontend
    restart: unless-stopped
    # NEXT_PUBLIC_API_URL is baked in at build time, so build here with it set.
    command: sh -c "npm run build && npm run start -- --hostname 0.0.0.0 --port 3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${DOMAIN}
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: flip7-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
