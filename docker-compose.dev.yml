# Development stack: Postgres + Django (runserver) + Next.js (next dev).
# Run with:  make dev   (which passes --env-file .env.dev)
# Values fall back to sane dev defaults, so this also works with no .env.dev.

services:
  db:
    image: postgres:16-alpine
    container_name: flip7-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flip7}
      POSTGRES_USER: ${POSTGRES_USER:-flip7}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flip7pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flip7-backend
    entrypoint: ["sh", "/app/entrypoint.sh"]
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: flip7_backend.settings
      DJANGO_ENV: ${DJANGO_ENV:-dev}
      FLIP7_TEST_SEED: ${FLIP7_TEST_SEED:-local-dev-seed}
      POSTGRES_DB: ${POSTGRES_DB:-flip7}
      POSTGRES_USER: ${POSTGRES_USER:-flip7}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flip7pass}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flip7-frontend
    command: npm run dev -- --hostname 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend

volumes:
  postgres_data:
