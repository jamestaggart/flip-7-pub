services:
  db:
    image: postgres:16-alpine
    container_name: flip7-db
    environment:
      POSTGRES_DB: flip7
      POSTGRES_USER: flip7
      POSTGRES_PASSWORD: flip7pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flip7-backend
    entrypoint: ["sh", "/app/entrypoint.sh"]
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: flip7_backend.settings
      DJANGO_ENV: dev
      FLIP7_TEST_SEED: local-dev-seed
      POSTGRES_DB: flip7
      POSTGRES_USER: flip7
      POSTGRES_PASSWORD: flip7pass
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flip7-frontend
    command: npm run dev -- --hostname 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
